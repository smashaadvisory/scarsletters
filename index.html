*{box-sizing:border-box}

<script>
/* ============================================================================
   Gochara engine — pure calculation layer (no DOM).
   Sidereal (Lahiri), geocentric, whole-sign bhava from natal Lagna or Chandra.
   Sources: Meeus, Astronomical Algorithms (Sun ch.25, Moon ch.47, sidereal time
   ch.12, nutation ch.22); JPL "Keplerian elements for approximate positions"
   (Standish, 1800–2050) for the planets; optional astronomy-engine (MIT) when
   present on window for higher planetary accuracy.
   ============================================================================ */
const GOCHARA=(()=>{
'use strict';
const D2R=Math.PI/180, R2D=180/Math.PI;
const norm=x=>((x%360)+360)%360;
const sin=x=>Math.sin(x*D2R), cos=x=>Math.cos(x*D2R);

/* ---------- time ---------- */
function jdFromDate(date){return date.getTime()/86400000+2440587.5}
function dateFromJd(jd){return new Date((jd-2440587.5)*86400000)}
function deltaT(jd){ // seconds, Espenak–Meeus polynomial (2005–2050 fit)
  const y=2000+(jd-2451545)/365.25; const t=y-2000;
  if(y<2005)return 63.86+0.3345*t-0.060374*t*t+0.0017275*t*t*t+0.000651814*t*t*t*t+0.00002373599*t*t*t*t*t;
  if(y<2050)return 62.92+0.32217*t+0.005589*t*t;
  return -20+32*((y-1820)/100)**2-0.5628*(2150-y);
}
const centuries=jdTT=>(jdTT-2451545)/36525;

/* ---------- ayanamsa (Lahiri / Chitrapaksha) ---------- */
// Official definition (Indian Calendar Reform Committee, as used by Swiss Ephemeris / AstroSage):
// 23°15′00.658″ on 21 March 1956 0h (JD 2435553.5), carried forward with general precession in longitude.
const AYAN_T0=(2435553.5-2451545)/36525, AYAN_A0=23.250182778;
const precessLon=T=>5028.796195*T+1.1054348*T*T; // arcseconds, cumulative from J2000
function ayanamsa(jdTT){const T=centuries(jdTT);return AYAN_A0+(precessLon(T)-precessLon(AYAN_T0))/3600}

/* ---------- nutation & obliquity ---------- */
function nutation(T){const om=norm(125.04452-1934.136261*T), Ls=norm(280.4665+36000.7698*T), Lm=norm(218.3165+481267.8813*T);
  const dpsi=(-17.20*sin(om)-1.32*sin(2*Ls)-0.23*sin(2*Lm)+0.21*sin(2*om))/3600;
  const deps=(9.20*cos(om)+0.57*cos(2*Ls)+0.10*cos(2*Lm)-0.09*cos(2*om))/3600;return {dpsi,deps}}

  M:norm(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000),
  Mp:norm(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000),
  F:norm(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000),

For every potential period, first establish the natal promise.

/* ---------- A client-safe paragraph for one day, read from the transits on that native's chart (the astrologer edits it before it is shown). ---------- */
function dailyText(client,dateStr){const S=loadSettings();const m=natalBundle(client,S);if(m.error)return '';
  const tz=client.timezone||BROWSER_TZ;const at=G.zonedToUtc(dateStr,'12:00',tz);const tr=G.chart(at,{nodeMode:S.nodeMode,outer:false});
  const phrase=(key,hm)=>GT[key]?GT[key].h[hm-1].replace(/^(In the \d+\w\w|Over the natal Moon):\s*/,'').split(/[.]/)[0].trim():'';
  const clean=t=>t.replace(/\bthe native['’]s\b/g,'your').replace(/\bthe native\b/g,'you').replace(/\b(Sun|Moon|Mars|Mercury|Jupiter|Venus|Saturn|Rahu|Ketu|the Moon|natal)['’]?s?\b/g,'').replace(/\s{2,}/g,' ').replace(/\s+([,;])/g,'$1').trim();
  const cap=t=>t?t[0].toUpperCase()+t.slice(1):'';const sent=t=>{t=cap(clean(t));return t?(/[.!?]$/.test(t)?t:t+'.'):''};
  const W={saturn:3,jupiter:3,rahu:2,ketu:2,mars:2,sun:1.5,venus:1.5,mercury:1};const facts=[];
  for(const p of tr.planets){const hm=G.houseFrom(p.sign,m.moon.sign);const mv=G.moonTransit(p.key,hm,tr.planets,m.moon.sign);if(!W[p.key])continue;const w=W[p.key]*(mv.good?(mv.vedhaBy?.35:1):-1);facts.push({key:p.key,hm,good:mv.good&&!mv.vedhaBy,v:w})}
  facts.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v));
  const moon=tr.planets.find(p=>p.key==='moon');const mh=G.houseFrom(moon.sign,m.moon.sign);const mv=G.moonTransit('moon',mh,tr.planets,m.moon.sign);
  const MOOD={1:'a day that turns on your own mood and body — notice what you need before you decide anything',2:'a day for home, food and family, with a tendency to spend or speak quickly',3:'a lively day for errands, messages and short exchanges',4:'a quieter, inward day; home and the people in it come first',5:'a day with room for play, children, romance or a creative hour',6:'a working day — tasks, health routines and small frictions that are better dealt with than avoided',7:'a day shaped by other people — partners, meetings, what is asked of you',8:'a day to keep simple; feelings run deeper than events, and rest is not wasted',9:'a day that opens outward — learning, travel, a teacher or a wider view',10:'a day for the work in front of you; effort is noticed',11:'a day for friends, groups and small gains; ask for what you want',12:'a low-key day for solitude, sleep and finishing rather than starting'}[mh];
  const score=facts.reduce((t,f)=>t+f.v,0);const good=facts.filter(f=>f.good).slice(0,2),hard=facts.filter(f=>!f.good).slice(0,2);
  const parts=[];parts.push(`Today reads as ${MOOD}${mv.good===false?', and it may feel heavier than it looks':''}.`);
  const gp=good.map(f=>sent(phrase(f.key,f.hm))).filter(Boolean);const hp=hard.map(f=>sent(phrase(f.key,f.hm))).filter(Boolean);
  if(gp.length)parts.push('In your favour: '+gp.join(' '));
  if(hp.length)parts.push('Needing care: '+hp.join(' '));
  parts.push(score>=3?'On balance the day supports you; move on what matters and let smaller things wait.':score<=-3?'On balance the day asks for patience; keep commitments light, say less than you know, and let it pass.':'On balance the day is even; take the openings it offers and do not force the rest.');
  return parts.join(' ')}

  if(natal.error){container.innerHTML=`<p class="warn">${esc(natal.error)}</p>`;return {destroy(){}}}

  const GT_SOURCE='Written for this app as a synthesis in the manner of Barbara Pijan Lama’s gochara pages, K. S. Charak’s <em>Elements of Vedic Astrology</em> (vols. 1–2) and Bepin Behari’s <em>Esoteric Astrology</em> — paraphrase, not quotation; live passages from BPL’s site are in Research.';
  function gocharaInsight(p,c,o={}){const t=GT[p.key];if(!t)return '';const hm=p.houseMoon;const mv=G.moonTransit(p.key,hm,c.tr.planets,natalMoon.sign);const vh=(G.GOCHARA_MOON[p.key]||{vedha:{}}).vedha[hm];
    const hb=t.h[hm-1].replace(/^In the (\d+(?:st|nd|rd|th)):/,'Counted from the natal Moon, in the $1:');let verdict=mv.good?`Classically this is one of ${p.en}’s favourable positions`:`Classically this is not one of ${p.en}’s favourable positions`;

  function inspector(c){const sel=st.sel;const ref=c.ref;const lords=dashaLords(c.dasha);const isL=k=>lords.includes(k);

function dashaChangeList(natalInstant,moonLon,from,days){const out=[];const limit=from.getTime()+days*86400000;let d=G.dashaAt(natalInstant,moonLon,from);

const SLOW_KEYS=['mars','jupiter','saturn','rahu','ketu'];
function slowEvents(from,days,nodeMode){const limit=from.getTime()+days*86400000;const ev=[];

    const add=el.querySelector('#syn-add');if(add)add.onclick=()=>{const {rows}=transitRows(st.instant);const loc=G.utcToZoned(st.instant,tz());

/* ---------------- Client activity log (visible to the astrologer only) ---------------- */
// Records when a client opens the calendar, which screen they are on, a heartbeat each minute while the page is
// visible, and when they leave — so the dashboard can show who is on the app now and how long they stay.
const ACT={code:null,sid:null,screen:'calendar',last:'',timer:null,bound:false,cur:null,curStart:0,curAcc:0,reads:{},readDate:null,io:null,lastDate:null,
  start(code){ACT.code=code;let sid=sessionStorage.getItem('as.sid');if(!sid){sid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);sessionStorage.setItem('as.sid',sid)}ACT.sid=sid;ACT.last='';ACT.screen='calendar';ACT.cur=null;
    ACT.send('open',{screen:'calendar',tz:Intl.DateTimeFormat().resolvedOptions().timeZone,width:window.innerWidth,touch:'ontouchstart' in window});ACT.bind()},
  stop(reason){if(!ACT.code)return;ACT.flushReads();ACT.beacon('close',{screen:ACT.screen,reason:reason||'signed out',prev_ms:ACT.dwellMs()});if(ACT.timer)clearInterval(ACT.timer);ACT.timer=null;ACT.code=null;ACT.cur=null},
  // Time the current screen has been visible, in ms (pauses while the tab is hidden).
  dwellMs(){if(!ACT.cur)return 0;return Math.round(ACT.curAcc+(document.visibilityState==='visible'?Date.now()-ACT.curStart:0))},
  // A screen change: the previous screen's visible time travels with the new event (prev_ms), so nothing extra is sent.
  view(screen,detail){const d={screen,...(detail||{})};const key=JSON.stringify(d);if(key===ACT.last)return;const prev=ACT.cur?{prev_screen:ACT.cur.screen,prev_ms:ACT.dwellMs()}:{};
    ACT.last=key;ACT.screen=screen;ACT.cur=d;ACT.curStart=Date.now();ACT.curAcc=0;ACT.send('view',{...d,...prev})},
  // Something done on the current screen (export, copy, print): recorded without changing the screen or its timing.
  action(what,detail){ACT.send('view',{screen:what,...(detail||{})})},
  send(event,detail){if(!ACT.code||typeof api.logActivity!=='function')return;try{Promise.resolve(api.logActivity(ACT.code,ACT.sid,event,detail||{})).catch(()=>{})}catch(e){}},
  // Used when the page is being hidden or closed: a keep-alive request survives navigation.
  beacon(event,detail){if(!ACT.code)return;if(MOCKED||!configured()){ACT.send(event,detail);return}
    try{fetch(CONFIG.SUPABASE_URL+'/rest/v1/rpc/client_log',{method:'POST',keepalive:true,headers:{'content-type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY,authorization:'Bearer '+CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({p_code:ACT.code,p_session:ACT.sid,p_event:event,p_detail:detail||{}})}).catch(()=>{})}catch(e){}},
  // Which entries on the open day are actually on screen, and for how long (an entry counts while at least half of it is visible).
  watchEntries(container,date){if(!ACT.code)return;ACT.flushReads();ACT.readDate=date;ACT.lastDate=date;ACT.reads={};
    if(!('IntersectionObserver' in window))return;
    ACT.io=new IntersectionObserver(ents=>{for(const e of ents){const t=e.target.querySelector('h4');if(!t)continue;const r=ACT.reads[t.textContent]=ACT.reads[t.textContent]||{ms:0,since:0};
      if(e.isIntersecting&&document.visibilityState==='visible'){if(!r.since)r.since=Date.now()}else if(r.since){r.ms+=Date.now()-r.since;r.since=0}}},{threshold:0.5});
    container.querySelectorAll('article.inf').forEach(a=>ACT.io.observe(a));
    container.querySelectorAll('details.infd').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&ACT.code)ACT.action('open entry',{entry:d.dataset.entry,date})}))},
  flushReads(){if(ACT.io){ACT.io.disconnect();ACT.io=null}if(!ACT.readDate)return;const now=Date.now();
    const list=Object.entries(ACT.reads).map(([title,r])=>({title,ms:Math.round(r.ms+(r.since?now-r.since:0))})).filter(x=>x.ms>=1500).sort((a,b)=>b.ms-a.ms).slice(0,12);
    if(list.length)ACT.send('view',{screen:'entries',date:ACT.readDate,entries:list});ACT.reads={};ACT.readDate=null},
  bind(){if(ACT.timer)clearInterval(ACT.timer);ACT.timer=setInterval(()=>{if(ACT.code&&document.visibilityState==='visible')ACT.send('heartbeat',{screen:ACT.screen,ms:ACT.dwellMs()})},60000);
    if(ACT.bound)return;ACT.bound=true;
    document.addEventListener('visibilitychange',()=>{if(!ACT.code)return;
      if(document.visibilityState==='hidden'){ACT.flushReads();ACT.beacon('close',{screen:ACT.screen,reason:'hidden',prev_ms:ACT.dwellMs()});ACT.curAcc=0;ACT.curStart=Date.now()}
      else{ACT.curStart=Date.now();ACT.curAcc=0;ACT.send('open',{...(ACT.cur||{screen:ACT.screen}),reason:'resumed'});const dp=document.querySelector('#daypanel');if(dp&&ACT.lastDate)ACT.watchEntries(dp,ACT.lastDate)}});
    window.addEventListener('pagehide',()=>{if(ACT.code){ACT.flushReads();ACT.beacon('close',{screen:ACT.screen,reason:'left',prev_ms:ACT.dwellMs()})}});
    document.addEventListener('copy',()=>{if(!ACT.code)return;let sel='',entry;try{const S=window.getSelection();sel=String(S||'');const n=S&&S.anchorNode;const a=n&&(n.nodeType===1?n:n.parentElement);const art=a&&a.closest('article.inf');if(art){const h=art.querySelector('h4');entry=h?h.textContent:undefined}}catch(e){}
      ACT.action('copy',{chars:sel.length,entry,date:ACT.lastDate})});
    window.addEventListener('beforeprint',()=>{if(ACT.code)ACT.action('print',{date:ACT.lastDate})})}
};

async function route(){

  const path=h.slice(1).split('?')[0];

/* ICS */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function icsTitle(i){const cat=CAT[i.category]||'General';const p={supportive:'Supportive window',caution:'Allow extra care',mixed:'Variable conditions',especially_sensitive:'Important to review'}[i.polarity];return i.category==='rest'?'Rest and restoration period':`${p}: ${cat}`}
function buildICS(pkg,opts){
  const dt=s=>s.replace(/-/g,'');
  const addDay=s=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+1)).replace(/-/g,'')};
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Sonnentau//Calendar//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Atelier Sonnentau — '+icsEscape(pkg.name)];
  const list=(pkg.influences||[]).filter(i=>i.calendar_sync_enabled!==false).filter(i=>!opts.inView||opts.inView(i)).filter(i=>{
    if(opts.polarities.length&&!opts.polarities.includes(i.polarity)&&!(opts.significant&&i.significant))return false;
    if(opts.categories.length&&!opts.categories.includes(i.category))return false;return true});
  for(const i of list){
    out.push('BEGIN:VEVENT',`UID:${i.id}@sonnentau`,`DTSTAMP:${dt(todayStr())}T000000Z`);
    if(opts.exactTimes&&i.start_time){const tz=i.timezone||'UTC';out.push(`DTSTART;TZID=${tz}:${dt(i.start_date)}T${t5(i.start_time).replace(':','')}00`,`DTEND;TZID=${tz}:${dt(i.end_date)}T${t5(i.end_time||i.start_time).replace(':','')}00`)}
    else out.push(`DTSTART;VALUE=DATE:${dt(i.start_date)}`,`DTEND;VALUE=DATE:${addDay(i.end_date)}`);
    out.push(`SUMMARY:${icsEscape(icsTitle(i))}`);
    let desc=i.client_interpretation||'';if(opts.reminders&&i.recommended_actions)desc+='\n\nConsider: '+lines(i.recommended_actions).join('; ');
    out.push(`DESCRIPTION:${icsEscape(desc)}`,`CATEGORIES:${icsEscape(CAT[i.category]||'General')}`,'END:VEVENT');
  }
  out.push('END:VCALENDAR');return out.join('\r\n');
}

// Downscale an uploaded image to a small JPEG data URL (long side ≤ max px) so it fits comfortably in the database.
function shrinkImage(file,max){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.82))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that image.'))};img.src=url})}

    o.supportive_for=o.polarity==='mixed'?sup:[];o.difficult_for=o.polarity==='mixed'?dif:[];
    for(const cb of ['significant','show_exact_time','show_technical_basis','calendar_sync_enabled'])o[cb]=form.elements[cb].checked;o.prediction='';o.show_prediction=true;
    o.intensity=o.intensity===''?'':Math.min(5,Math.max(1,Number(o.intensity)||1));o.secondary_categories=secs.filter(x=>x!==o.category);o.jyotish=j;o.source_reference=s;o.transit_snapshot=inf.transit_snapshot||null;o.parent_id=o.parent_id||null;
    o.start_date=fixYear(o.start_date);o.end_date=fixYear(o.end_date);
    if(o.end_date<o.start_date)o.end_date=o.start_date;return o};
  const datesOk=()=>{const o=collect();if(!yearOk(o.start_date)||!yearOk(o.end_date)){alert(`The year in the dates looks wrong (${yearOf(o.start_date)}). Please enter a four-digit year such as ${new Date().getFullYear()}.`);return false}return true};
  const updateSig=()=>{const o=collect();const p=POLARITY[o.polarity];$('#sigpreview',dlg).innerHTML=`Marker: ${icon(p.shape,p.color)} <strong>${p.label}</strong> · ${p.hint}${o.category?` · Category accent <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cat-${o.category})"></span> ${esc(CAT[o.category])}`:' · <em>choose a category</em>'}${o.significant?' · '+icon('star','var(--significant)')+' significant':''}${o.category==='remedies'?' · <em>visible only to clients with the remedial add-on</em>':''}`};
  form.addEventListener('input',()=>{updateSig();$('#mixedareas',dlg).classList.toggle('hidden',form.elements.polarity.value!=='mixed')});updateSig();
  const review=()=>{const o=collect();const fields={Title:o.title,Interpretation:o.client_interpretation,Notice:o.observation_prompt,Consider:o.reflection_prompt,Act:o.recommended_actions,Postpone:o.avoidances,Remedial:o.remedial_note};
    const hits=Object.entries(fields).map(([k,v])=>[k,langCheck(v)]).filter(([,h])=>h.length);
    const missing=[];if(!o.client_interpretation)missing.push('an interpretation');if(o.category==='health'&&!['health','custom'].includes(o.disclaimer))missing.push('a health boundary disclaimer');if(o.category==='legal'&&!['legal','custom'].includes(o.disclaimer))missing.push('a legal disclaimer');if(o.category==='money'&&!['financial','custom'].includes(o.disclaimer))missing.push('a financial disclaimer');if((o.category==='remedies'||o.remedial_note)&&!['remedy','custom'].includes(o.disclaimer))missing.push('the remedy disclaimer');
    if(o.polarity==='especially_sensitive'&&!o.reflection_prompt)missing.push('a reflection prompt (recommended for especially sensitive periods)');
    const p=POLARITY[o.polarity];
    $('#review',dlg).innerHTML=`<div class="card" style="background:var(--surface-2);box-shadow:none"><h3>Pre-publication review</h3>
     <div class="row"><span class="pill ${o.polarity}">${icon(p.shape,p.color,12)} ${p.label}</span>${o.significant?`<span class="pill significant">Especially significant</span>`:''}<span class="tag">${esc(CAT[o.category])}</span><span class="tag">Intensity ${o.intensity}</span><span class="tag">token: ${o.polarity} / ${p.shape}</span><span class="tag">aria: ${esc(o.accessibility_label||`${p.label}: ${CAT[o.category]}`)}</span></div>
     ${hits.length?`<div class="warn" style="margin-top:8px"><strong>Language check:</strong> possibly deterministic or alarmist wording — ${hits.map(([k,h])=>`${k}: “${h.map(esc).join('”, “')}”`).join('; ')}. Consider softening (“may”, “consider”, “allow extra care”).</div>`:`<div class="ok" style="margin-top:8px">Language check: no deterministic or alarmist phrases detected.</div>`}
     ${missing.length?`<div class="warn" style="margin-top:8px">Consider adding ${missing.join(', ')}.</div>`:''}
     <h4 style="margin-top:12px">Client will see</h4><div id="pvblock"></div>
     <p class="row"><button class="btn" type="button" id="confirmpub">Publish now</button><button class="btn ghost" type="button" id="backedit">Keep editing</button></p></div>`;
    const proj={...o,id:inf.id,supportive_for:o.supportive_for,difficult_for:o.difficult_for,start_time:o.show_exact_time?o.start_time:'',end_time:o.show_exact_time?o.end_time:'',prediction:'',technical_basis:o.show_technical_basis?o.technical_basis:'',custom_disclaimer:o.disclaimer==='custom'?o.custom_disclaimer:''};
    const stub=document.createElement('div');stub.innerHTML='<div id="daypanel"></div>';drawDay({influences:[proj],default_disclaimer:'none'},[proj],o.start_date,stub);$('#pvblock',dlg).innerHTML=stub.querySelector('.inf')?.outerHTML||'';
    $('#review',dlg).scrollIntoView({behavior:'smooth'});
    $('#confirmpub',dlg).onclick=()=>persist(true,'Published');$('#backedit',dlg).onclick=()=>{$('#review',dlg).innerHTML=''}};
  const busy=on=>dlg.querySelectorAll('button').forEach(b=>b.disabled=on);
  const persist=async(pub,msg)=>{busy(true);try{const o={...inf,...collect(),published:pub};await api.saveInfluence(o);dlg.close();dlg.remove();toast(msg);ctx.reload()}catch(e){busy(false);alert('Could not save: '+e.message)}};
  $('#savedraft',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;persist(false,'Draft saved — not visible to the client until published')};
  $('#publish',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;review()};
  const un=$('#unpub',dlg);if(un)un.onclick=()=>persist(false,'Unpublished');
  const del=$('#del',dlg);if(del)del.onclick=guard(async()=>{if(confirm('Delete this influence? Windows within it will be kept but unlinked.')){busy(true);try{await api.deleteInfluence(inf.id)}catch(e){busy(false);throw e}dlg.close();dlg.remove();ctx.reload()}});
  $('#close',dlg).onclick=()=>{dlg.close();dlg.remove()};
  dlg.addEventListener('cancel',()=>dlg.remove());
}

/* ---------------- Templates ---------------- */
/* ---------------- Boot ---------------- */
route();
</script>
</body>
